        value: 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
      - key: R2_ACCOUNT_ID
        value: acb5def369b69f492571d42e56057f1a
      - key: R2_BUCKET_NAME
        value: gametok-games-assets
      - key: R2_PUBLIC_URL
        value: https://pub-b7694276c8f54290854b276638a93b62.r2.dev
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
