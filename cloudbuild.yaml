# Cloud Build configuration for automatic deployment to Cloud Run
# Triggers on push to main branch

# Builds reuse the previous image's layers (--cache-from :latest), so the system packages, the
# agy CLI and npm install (~1 GB, incl. Chrome for thumbnails) only rerun when the Dockerfile or
# package*.json change. A code-only push rebuilds just the source layer.

steps:
  # Pull the last image to use as a layer cache (missing on the very first build: that's fine)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull gcr.io/$PROJECT_ID/gametok-backend:latest || exit 0']

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--cache-from', 'gcr.io/$PROJECT_ID/gametok-backend:latest',
      # BuildKit only reuses an image's layers as cache if it was built with this; the classic builder ignores it.
      '--build-arg', 'BUILDKIT_INLINE_CACHE=1',
      '-t', 'gcr.io/$PROJECT_ID/gametok-backend:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/gametok-backend:latest',
      '.'
    ]

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gametok-backend:$COMMIT_SHA']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gametok-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/gametok-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '1'

  # ---- GTA Lagos multiplayer (services/lagos-online): its own service, near Lagos (London), one
  # always-on instance (players' money lives in it), its files on a bucket mounted at /data
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/lagos-online:$COMMIT_SHA', 'services/lagos-online']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lagos-online:$COMMIT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args: ['-c', 'gcloud storage buckets describe gs://$PROJECT_ID-lagos-online-data >/dev/null 2>&1 || gcloud storage buckets create gs://$PROJECT_ID-lagos-online-data --location=europe-west2 --uniform-bucket-level-access']
  # (the bucket is mounted on the first deploy; later deploys keep it and only change the image)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        VOL=""
        gcloud run services describe lagos-online --region europe-west2 >/dev/null 2>&1 || VOL="--add-volume name=data,type=cloud-storage,bucket=$PROJECT_ID-lagos-online-data --add-volume-mount volume=data,mount-path=/data"
        gcloud run deploy lagos-online --image gcr.io/$PROJECT_ID/lagos-online:$COMMIT_SHA \
          --region europe-west2 --platform managed --allow-unauthenticated --execution-environment gen2 \
          --cpu 1 --memory 512Mi --no-cpu-throttling --min-instances 1 --max-instances 1 --concurrency 1000 \
          --timeout 3600 --session-affinity --update-env-vars DATA_DIR=/data,ECONOMY=1 $$VOL

images:
  - 'gcr.io/$PROJECT_ID/gametok-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/gametok-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  # 8 vCPUs: npm install and the image push run several times faster than on the default machine.
  machineType: 'E2_HIGHCPU_8'
