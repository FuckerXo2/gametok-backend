<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GameTok · Revenue</title>
<!-- TokBux bought with real money (Apple + Google, checked by the backend itself). Dollars are each pack's US list
     price, before the stores' cut (15% in the small business programs, else 30%). Data: /api/admin/revenue. -->
<style>
  :root {
    --bg: #0c0e14; --panel: #151823; --panel2: #1c2030; --line: #272c3d;
    --text: #e7e9f0; --dim: #8b91a7; --ok: #38d39f; --bad: #ff5c6c; --accent: #6c8cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; font-weight: 650; }
  h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; margin: 22px 24px 10px; font-weight: 600; }
  .muted { color: var(--dim); }
  .cards { display: flex; gap: 12px; padding: 18px 24px 4px; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; min-width: 140px; }
  .card .n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .l { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .controls button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  .controls button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chart { margin: 0 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 8px; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 140px; }
  .bar { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
  .bar:hover { background: #8aa4ff; }
  .bar:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -6px);
    background: #000; padding: 4px 8px; border-radius: 6px; font-size: 12px; white-space: nowrap; }
  .axis { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 24px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.bad { background: rgba(255,92,108,.14); color: var(--bad); }
  .pill.test { background: rgba(139,145,167,.16); color: var(--dim); }
  .empty { padding: 40px 24px; text-align: center; color: var(--dim); }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
  <header>
    <h1>GameTok Revenue</h1>
    <span class="muted" id="updated">loading…</span>
    <span style="flex:1"></span>
    <span class="controls" id="range">
      <button data-d="7">7 days</button><button data-d="30" class="active">30 days</button><button data-d="90">90 days</button><button data-d="365">1 year</button>
    </span>
  </header>
  <div class="cards" id="cards"></div>
  <h2>Per day</h2>
  <div class="chart"><div class="bars" id="bars"></div><div class="axis" id="axis"></div></div>
  <h2>Packs</h2>
  <div class="wrap"><table id="packs"></table></div>
  <h2>Latest purchases</h2>
  <div class="wrap"><table id="recent"></table></div>
<script>
  const urlKey = new URLSearchParams(location.search).get('key');
  try { if (urlKey) localStorage.setItem('gametok_admin_key', urlKey); } catch {}
  let KEY = urlKey || ''; try { KEY = KEY || localStorage.getItem('gametok_admin_key') || ''; } catch {}
  const $ = (id) => document.getElementById(id);
  const usd = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = (s) => (s === 'apple' ? 'App Store' : 'Google Play');
  let days = 30;

  async function load() {
    $('updated').textContent = 'loading…';
    const res = await fetch('/api/admin/revenue?days=' + days + (KEY ? '&key=' + encodeURIComponent(KEY) : ''));
    if (!res.ok) { $('updated').textContent = res.status === 401 ? 'Locked: open with ?key=…' : 'Could not load (' + res.status + ')'; return; }
    const d = await res.json(), t = d.totals;
    $('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
    $('cards').innerHTML = [
      [usd(t.usd), 'revenue (list price)'], [usd(t.usd * 0.85), 'after the stores (15%)'], [t.purchases, 'purchases'],
      [t.buyers, 'buyers'], [Number(t.tokbuxSpent).toLocaleString(), 'TokBux spent'], [t.refunds, 'refunds'], [t.sandbox, 'test purchases'],
    ].map(([n, l]) => `<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

    // one bar per day, empty days included
    const byDay = Object.fromEntries(d.daily.map((r) => [r.day, r]));
    const list = [];
    for (let i = d.days - 1; i >= 0; i--) { const k = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); list.push({ day: k, ...(byDay[k] || { usd: 0, purchases: 0 }) }); }
    const max = Math.max(1, ...list.map((r) => r.usd));
    $('bars').innerHTML = list.map((r) => `<div class="bar" style="height:${(r.usd / max) * 100}%" data-tip="${r.day}: ${usd(r.usd)} · ${r.purchases}"></div>`).join('');
    $('axis').innerHTML = `<span>${list[0].day}</span><span>${list[list.length - 1].day}</span>`;

    $('packs').innerHTML = d.packs.length
      ? '<tr><th>Pack</th><th>Store</th><th class="num">Purchases</th><th class="num">Revenue</th></tr>' + d.packs.map((p) =>
        `<tr><td>${esc(p.product_id.replace('tokbux_', ''))} TokBux</td><td>${store(p.store)}</td><td class="num">${p.purchases}</td><td class="num">${usd(p.usd)}</td></tr>`).join('')
      : '<tr><td class="empty">No purchases yet</td></tr>';
    $('recent').innerHTML = d.recent.length
      ? '<tr><th>When</th><th>Player</th><th>Pack</th><th>Store</th><th class="num">Price</th><th></th></tr>' + d.recent.map((p) =>
        `<tr><td>${new Date(p.created_at).toLocaleString()}</td><td>${esc(p.username || '—')}</td><td>${p.tokbux.toLocaleString()} TokBux</td><td>${store(p.store)}</td><td class="num">${usd(p.usd)}</td>
         <td>${p.refunded_at ? '<span class="pill bad">refunded</span>' : ''}${p.sandbox ? '<span class="pill test">test</span>' : ''}</td></tr>`).join('')
      : '<tr><td class="empty">No purchases yet</td></tr>';
  }
  $('range').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    days = Number(b.dataset.d);
    for (const x of $('range').children) x.classList.toggle('active', x === b);
    load();
  };
  load();
</script>
</body>
</html>
