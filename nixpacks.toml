[phases.setup]
nixPkgs = ["...", "nodejs_20", "git", "ffmpeg", "python3", "unzip"]
aptPkgs = [
    "...",
    "git",
    "fonts-liberation",
    "libappindicator3-1",
    "libasound2",
    "libatk-bridge2.0-0",
    "libatk1.0-0",
    "libgbm1",
    "libgtk-3-0",
    "libnspr4",
    "libnss3",
    "libx11-xcb1",
    "libxcomposite1",
    "libxdamage1",
    "libxfixes3",
    "libxi6",
    "libxrandr2",
    "libxss1",
    "libxtst6",
    "libdrm2",
    "libxkbcommon0",
    "libxshmfence1"
]

[phases.install]
cmds = [
    "npm ci",
    # Install straight into /usr/local so the binary lands at /usr/local/bin/kimi, which is on PATH
    # for the runtime process. The installer supports this explicitly (KIMI_INSTALL_DIR, default
    # $HOME/.kimi-code) so there is nothing to guess.
    #
    # This replaces a `ln -sf <guess> || ln -sf <guess> || ... || true` chain that could not work:
    # `ln -sf` exits 0 even when the SOURCE does not exist -- it just creates a dangling symlink.
    # So the first guess always "succeeded", the fallbacks never ran, `|| true` swallowed anything
    # left, and the build went green with a broken link. The failure only showed up at runtime as
    # `spawn kimi ENOENT` on every generation.
    "curl -fsSL https://code.kimi.com/kimi-code/install.sh | KIMI_INSTALL_DIR=/usr/local bash",
    # Fail the BUILD if kimi is not actually runnable, rather than shipping and failing per-job.
    "kimi --version"
]

[variables]
NIXPACKS_NODE_VERSION = "20"
GAMETOK_MAKER_AGENT_IMPLEMENT_TURNS = "2"
